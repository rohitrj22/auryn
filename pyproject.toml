[project]
name = "auryn"
version = "0.1.0"
description = "A FalkorDB-backed memory engine for AI agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "falkordb==1.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
auryn-demo = "demo.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auryn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
